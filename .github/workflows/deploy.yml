# Deploys the Claims Module to Azure. Run it from Actions → "Deploy to Azure" → Run workflow.
#
# Repository settings (printed, or written with SET_GITHUB_SECRETS=1, by infra/deploy.sh):
#   secrets:   AZURE_CREDENTIALS, AZURE_SQL_CONNECTION_STRING, AZURE_STATIC_WEB_APPS_API_TOKEN
#   variables: AZURE_RESOURCE_GROUP, AZURE_SQL_SERVER_NAME, AZURE_WEBAPP_NAME, API_URL
name: Deploy to Azure

on:
  workflow_dispatch:        # manual trigger (allowed by the requirements)
  # push:
  #   branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  BACKEND_PROJECT: src/ClaimsModule.API/ClaimsModule.API.csproj                  # startup/API project
  DATA_PROJECT: src/ClaimsModule.Persistence/ClaimsModule.Persistence.csproj     # DbContext + migrations
  FRONTEND_DIR: frontend/claims-module-ui
  FRONTEND_OUTPUT: dist/claims-module-ui/browser                                 # Angular application builder output
  NODE_VERSION: '20'

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build and publish backend
        run: |
          dotnet restore ${{ env.BACKEND_PROJECT }}
          dotnet publish ${{ env.BACKEND_PROJECT }} -c Release -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: api
          path: ./publish

  migrate:
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # The runner needs temporary access to the SQL server (Azure SQL only admits Azure services).
      - name: Open SQL firewall for runner
        run: |
          IP=$(curl -s https://api.ipify.org)
          az sql server firewall-rule create -g ${{ vars.AZURE_RESOURCE_GROUP }} -s ${{ vars.AZURE_SQL_SERVER_NAME }} \
            -n github-runner-${{ github.run_id }} --start-ip-address $IP --end-ip-address $IP

      - name: Apply EF Core migrations
        run: |
          dotnet tool install --global dotnet-ef --version "9.*"
          dotnet ef database update \
            --project ${{ env.DATA_PROJECT }} \
            --startup-project ${{ env.BACKEND_PROJECT }} \
            --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

      - name: Close SQL firewall
        if: always()
        run: |
          az sql server firewall-rule delete -g ${{ vars.AZURE_RESOURCE_GROUP }} -s ${{ vars.AZURE_SQL_SERVER_NAME }} -n github-runner-${{ github.run_id }}

  deploy-backend:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api
          path: ./publish

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The SPA reads its API origin at runtime from config.js (no build-time env variable), so the
      # build is environment-neutral and this step points it at the deployed API.
      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm ci
          npm run build
          printf "window.__CLAIMS_CONFIG__ = { apiOrigin: '%s' };\n" "${{ vars.API_URL }}" > ${{ env.FRONTEND_OUTPUT }}/config.js

      - name: Deploy to Static Web App
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ${{ env.FRONTEND_DIR }}/${{ env.FRONTEND_OUTPUT }}
          skip_app_build: true
          skip_api_build: true
