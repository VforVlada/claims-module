deploy:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Publish the API
        run: dotnet publish src/ClaimsModule.API --configuration Release --output ./api-publish
      - name: Deploy the API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.API_APP_NAME }}
          package: ./api-publish
      - name: Build the SPA and point it at this environment's API
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm ci
          npx ng build
          printf "window.CLAIMS_CONFIG = { apiOrigin: '%s' };\n" "${{ vars.API_URL }}" > dist/claims-module-ui/browser/config.js
      - name: Deploy the SPA to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: ${{ env.FRONTEND_DIR }}/dist/claims-module-ui/browser
          skip_app_build: true
          skip_api_build: true

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - run: npm ci && npx playwright install --with-deps chromium
        working-directory: ${{ env.FRONTEND_DIR }}
      - name: Smoke tests (S-01..S-05)
        run: bash ./scripts/smoke-test.sh
        env:
          API_URL: ${{ vars.API_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          CI: "true"
      - if: failure()
        run: echo "::error::Smoke tests failed against ${{ vars.API_URL }} — this release is flagged; investigate before promoting further."
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-report
          path: ${{ env.FRONTEND_DIR }}/e2e/playwright-report