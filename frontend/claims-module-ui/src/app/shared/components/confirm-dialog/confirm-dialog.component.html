<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
  @if (data.requireReason) {
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Reason</mat-label>
      <textarea matInput [(ngModel)]="reason" rows="3" required [maxlength]="limits.reason"></textarea>
      <mat-hint align="end">{{ reason.length }} / {{ limits.reason }}</mat-hint>
    </mat-form-field>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="confirm()" [disabled]="data.requireReason && !reason.trim()">
    {{ data.confirmLabel || 'Confirm' }}
  </button>
</mat-dialog-actions>
